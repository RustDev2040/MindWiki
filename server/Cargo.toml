[package]
name = "mindwiki-server"
version = "0.1.0"
edition = "2026"
license = "Apache-2.0"

[lib]
name = "mindwiki_server"
path = "src/lib.rs"

[[bin]]
name = "mindwiki-server"
path = "src/main.rs"

[dependencies]
argon2 = { version = "0.6.0", features = ["getrandom"] }
axum = "0.8.9"
axum-server = { version = "0.9.1", features = ["tls-rustls-no-provider"] }
hex = "0.4.3"
rand = "0.10.3"
rcgen = "0.14.10"
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[dev-dependencies]
tempfile = "3.27.0"
